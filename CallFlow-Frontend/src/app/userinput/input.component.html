<div>
  
<div class="title">
   <h1> CALL FLOW <span> Customer Call Flow Simulation Tool </span> </h1>
</div>

  <form class="mt-3" name="form"  >
    <div class="container mt-5">

      <div class="row">
        <div class="btn-group">

          <button class="btn-outline col" type="button" data-bs-toggle="collapse" data-bs-target="#msisdn_collapse"
            aria-expanded="false" aria-controls="msisdn_collapse">
            MSISDN
          </button>

          <button class="btn-outline col" type="button" data-bs-toggle="collapse" data-bs-target="#imsi_collapse"
            aria-expanded="false" aria-controls="imsi_collapse">
            IMSI
          </button>


        </div>
      </div>
    </div>

    <div class="container mt-3">
      <div class="row">
        <div class="col mt-2 collapse" id="msisdn_collapse">
          <input type="text" class="form-control" id="msisdn"  placeholder=" Enter MSISDN"
          ngModel name="msisdn">
        </div>

        <div class="col mt-2 collapse" id="imsi_collapse">
          <input type="text" class="form-control"  placeholder="Enter IMSI"
          ngModel name="imsi">
        </div>
      </div>

    </div>

    

    <div class="datetime-container  row mt-5 text-center">

      <label class="datetime-label col-1 pt-1"> From</label>
      <div class="col-4">
        <input type="datetime-local" class="form-control" id="" 
        ngModel name="startDate" required>
      </div>
      <label class="datetime-label col-1 pt-1"> To</label>
      <div class="col-4">
        <input type="datetime-local" class="form-control" id="" 
        ngModel name="endDate" required>
      </div>

    </div>
    

    <div class="container row mt-5 mx-auto d-block">
      <div class="col text-center"> 
        <button class="btn btn-danger col-3 text-center" id="submitBtn" value="Apply" type="submit" > Submit </button>
      </div>
    </div>


  

  </form>
</div>
